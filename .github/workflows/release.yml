name: Build LibSagerNetCore AAR

on:
  push:
    branches:
      - dev*
    paths:
      - "app/**"
      - "buildSrc/**"
      - "library/**"
      - ".github/workflows/release.yml"
  
  workflow_dispatch:   # 手动触发最方便
    inputs:
      commit_sha:
        description: '指定 commit SHA（留空则使用最新）'
        required: false

jobs:
  build-aar:
    name: Build LibSagerNetCore AAR
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.inputs.commit_sha || github.sha }}

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version: 1.25.9
          cache-dependency-path: "library/core/go.sum"

      - name: Setup Go Mobile
        run: |
          go install golang.org/x/mobile/cmd/gomobile@v0.0.0-20260410095206-2cfb76559b7b
          go install golang.org/x/mobile/cmd/gobind@v0.0.0-20260410095206-2cfb76559b7b

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: 21
          cache: 'gradle'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-36'

      - name: Setup Android NDK
        id: setup-ndk
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r29

      - name: Native Build (生成 AAR)
        env:
          ANDROID_NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
        run: |
          ./run lib core

      - name: Upload AAR Artifact
        uses: actions/upload-artifact@v7
        with:
          name: LibSagerNetCore-AAR
          path: app/libs/libsagernetcore.aar
          if-no-files-found: error
          retention-days: 30   # 你可以改成 7 或 14
