name: Build AAR

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      
      - uses: actions/setup-go@v6
        with:
          go-version: 1.25.9
          cache-dependency-path: "library/core/go.sum"

      - run: go install golang.org/x/mobile/cmd/gomobile@v0.0.0-20260410095206-2cfb76559b7b
      - run: go install golang.org/x/mobile/cmd/gobind@v0.0.0-20260410095206-2cfb76559b7b

      - uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: 21

      - uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-36'

      - uses: nttld/setup-ndk@v1
        id: setup-ndk
        with:
          ndk-version: r29

      - run: ./run lib core
        env:
          ANDROID_NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}

      - uses: actions/upload-artifact@v7
        with:
          name: LibSagerNetCore
          path: app/libs/libsagernetcore.aar
